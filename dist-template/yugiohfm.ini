# Yu-Gi-Oh! Forbidden Memories - native port configuration
# Lines starting with # or ; are comments. Remove the # in front of an option to change it.

[general]
# Your own copy of the game: a disc image (.cue or .bin) or a YuGiOhFM.pak data pack made
# from it. When not set (or not found), the game uses YuGiOhFM.pak next to the executable
# if there is one, otherwise the first .cue/.bin in the "disc" folder.
#disc = C:\Games\Yu-Gi-Oh! Forbidden Memories.cue

# Folder for the memory card files: card1.mcd (slot 1) and card2.mcd (slot 2, for 2P Duel
# and Trade), standard 128 KB raw format that DuckStation, ePSXe, etc. also use - you can
# copy an existing save card here.
#savedir = saves

[video]
# Initial window size as a multiple of 320x240.
scale = 3
# 1 = start in fullscreen (F11 or Alt+Enter toggles at any time).
fullscreen = 0
# 1 = smooth (bilinear) scaling, 0 = sharp pixels like the original.
smooth = 0
# 1 = 4:3 picture like a CRT TV, 0 = square pixels.
aspect43 = 1

[behaviour]
# 1 = allow holding Tab to fast-forward. 0 = disabled.
fastforward = 1
# 1 = shorter loading pauses (music streaming is unaffected). 0 = original timing.
fastcd = 0

[keyboard]
# Comma-separated key names (SDL names, e.g. Up, X, Space, Return, Left Shift, Keypad 8).
#key_up       = Up
#key_down     = Down
#key_left     = Left
#key_right    = Right
#key_cross    = X,Space,K
#key_circle   = Z,L
#key_square   = S,J
#key_triangle = A,I
#key_l1       = Q
#key_r1       = W
#key_l2       = 1
#key_r2       = 2
#key_start    = Return
#key_select   = Right Shift,Backspace
# L3/R3 (pressing the analog sticks) - not bound to keys by default.
#key_l3       =
#key_r3       =
# Keys that push the left analog stick fully (analog mode), not bound by default.
#key_lstick_up    = Keypad 8
#key_lstick_down  = Keypad 2
#key_lstick_left  = Keypad 4
#key_lstick_right = Keypad 6
# The DualShock's ANALOG button (switches analog/digital mode unless the game locked it).
#key_analog   =

[controller]
# Controller plugged into both ports: dualshock (starts in digital mode like the real pad; the
# left stick works as the D-pad) or digital (the original digital pad).
controller = dualshock
# 1 = vibration (DualShock only), 0 = off.
rumble = 1
# Analog stick dead zone in percent of full deflection.
deadzone = 15
# Player 1 = keyboard + first controller, player 2 = second controller (plug in any time).
# Xbox / XInput controller buttons (SDL names): a b x y back start guide leftshoulder
# rightshoulder leftstick rightstick dpup dpdown dpleft dpright lefttrigger righttrigger
#pad_cross    = a
#pad_circle   = b
#pad_square   = x
#pad_triangle = y
#pad_l1       = leftshoulder
#pad_r1       = rightshoulder
#pad_l2       = lefttrigger
#pad_r2       = righttrigger
#pad_start    = start
#pad_select   = back
#pad_up       = dpup
#pad_down     = dpdown
#pad_left     = dpleft
#pad_right    = dpright
#pad_l3       = leftstick
#pad_r3       = rightstick
# Left stick pushed fully by buttons, and the ANALOG button (e.g. guide) - not bound by default.
#pad_lstick_up    =
#pad_lstick_down  =
#pad_lstick_left  =
#pad_lstick_right =
#pad_analog   =
# 1 = the left analog stick also works as the D-pad while the pad is in digital mode (in
# analog mode it is the analog stick only).
stick_as_dpad = 1
# Player 2's controller: the same names with pad2_ (default: the same layout as above).
#pad2_cross    = a
#pad2_circle   = b
#pad2_square   = x
#pad2_triangle = y
#pad2_l1       = leftshoulder
#pad2_r1       = rightshoulder
#pad2_l2       = lefttrigger
#pad2_r2       = righttrigger
#pad2_start    = start
#pad2_select   = back
#pad2_up       = dpup
#pad2_down     = dpdown
#pad2_left     = dpleft
#pad2_right    = dpright
#pad2_l3       = leftstick
#pad2_r3       = rightstick
